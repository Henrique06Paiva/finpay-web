services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: finpay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finpay_admin
      POSTGRES_PASSWORD: finpay_secret_password
      POSTGRES_DB: finpay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpay_admin -d finpay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: finpay_postgres_data
